edit_cases:

  - case_id: EC_001
    ref_clinical_case_id: SM_001
    description: 增加患者家庭背景
    message: 希望补充一些患者和家人的互动，让人物形象更丰满，但不要修改病例信息。

    intent:
      type: add_content
      target:
        - family_background

    involved_agent:
      required:
        - story
        - html

    evaluation:
      edit_type: add
      evaluation_focus: |
        应在原故事场景中自然补充患者与家人的互动细节，
        至少体现一种家庭成员及其陪伴、担忧、照护或鼓励。
        不应修改诊断、检查结果、治疗方案、疗效等病例事实。

    case_fact_consistency:
      follow: true

  - case_id: EC_002
    ref_clinical_case_id: SM_002
    description: 新增一个生产公司的描述

    message: 增加一个声明：由零假设科技有限公司生成

    intent:
      type: add_content
      target:
        - branding_attribution

    involved_agent:
      required:
        - html

    evaluation:
      edit_type: add
      evaluation_focus: |
        应只新增“由零假设科技有限公司生成”声明。
        原故事正文、病例事实、图片和核心版式不应发生实质变化。

    case_fact_consistency:
      follow: true

  - case_id: EC_003
    ref_clinical_case_id: SM_003
    description: 删除用药剂量描述

    message: 删除里面的用药剂量描述

    intent:
      type: remove_content
      target:
        - Medication dosage 
    involved_agent:
      required:
        - story
        - html

    evaluation:
      edit_type: remove
      evaluation_focus: |
        应删除故事和最终页面中的用药剂量描述。
        删除后故事仍需完整流畅，不应新增或篡改其他病例事实。

    case_fact_consistency:
      follow: true
      allowed_omissions:
        - Medication dosage

  - case_id: EC_004
    ref_clinical_case_id: SM_004
    description: 改成故事讲述视角

    message: 改成患者自述的方式分享故事。

    intent:
      type: rewrite_style
      target:
        - doctor_perspective

    involved_agent:
      required:
        - story
        - html

    evaluation:
      edit_type: rewrite
      evaluation_focus: |
        应将故事改为患者自述视角。
        叙事人称和表达方式应明显变化，但诊断、检查、治疗和疗效事实保持一致。

    case_fact_consistency:
      follow: true

  - case_id: EC_005
    ref_clinical_case_id: SM_005
    description: 精简故事内容

    message: 内容有些长，希望整体更加精炼，方便阅读。最好整体500字以内

    intent:
      type: condense

    involved_agent:
      required:
        - story
        - html

    evaluation:
      edit_type: condense
      evaluation_focus: |
        应将故事整体精简到约 500 字以内。
        保留核心诊断、治疗方案、关键疗效和患者转归，删除冗余表达。
        精简后最终页面中的故事正文应同步更新。

    case_fact_consistency:
      follow: true

  - case_id: EC_006
    ref_clinical_case_id: SM_006
    description: 扩充治疗过程

    message: 希望详细描述患者接受治疗后的变化，让治疗过程更加完整。

    intent:
      type: expand

    involved_agent:
      required:
        - story
        - html

    evaluation:
      edit_type: expand
      evaluation_focus: |
        应扩充患者接受治疗后的变化和治疗过程描述。
        新增内容必须来自既有病例事实或原故事信息，不应编造不存在的检查、疗效或治疗方案。
        最终页面中的故事正文应同步更新。

    case_fact_consistency:
      follow: true

  - case_id: EC_007
    ref_clinical_case_id: SM_007
    description: 调整故事结构

    message: 希望先介绍患者个人病史情况以及背景信息，再介绍诊断和治疗，最后介绍治疗效果。

    intent:
      type: restructure

    involved_agent:
      required:
        - story
        - html

    evaluation:
      edit_type: restructure
      evaluation_focus: |
        应按“患者个人病史及背景信息 -> 诊断和治疗 -> 治疗效果”的顺序重组故事。
        内容顺序应符合用户要求，医学事实不应被删改或重新解释。
        最终页面中的故事正文应同步更新。

    case_fact_consistency:
      follow: true

  - case_id: EC_008
    ref_clinical_case_id: SM_008
    description: 调整图片设计

    message: 希望增加工作场景情况，减少生活化场景相关图片。

    intent:
      type: visual_adjustment

    involved_agent:
      required:
        - image
        - html

    evaluation:
      edit_type: modify
      evaluation_focus: |
        应增加工作场景相关图片表达，并减少生活化场景图片占比。
        新图片设计和成图不应引入与病例事实冲突的人物身份、疾病表现或治疗信息。
        最终页面应同步使用调整后的图片。

    case_fact_consistency:
      follow: true

  - case_id: EC_009
    ref_clinical_case_id: SM_001
    description: 调整长图布局

    message: 希望整体排版更紧凑，重点信息更加突出。

    intent:
      type: layout_adjustment

    involved_agent:
      required:
        - html

    evaluation:
      edit_type: modify
      evaluation_focus: |
        应调整最终长图/HTML 页面布局，使排版更紧凑、重点信息更突出。
        不应修改故事正文、病例事实、图片内容或新增无关医学结论。

    case_fact_consistency:
      follow: true

  - case_id: EC_010
    ref_clinical_case_id: SM_010
    description: 调整生成的图片

    message: 把生成的图片2改的更自然，更符合生活常识一些。

    intent:
      type: visual_adjustment
      target:
        - generated_image_2

    involved_agent:
      required:
        - image
        - html

    evaluation:
      edit_type: modify
      evaluation_focus: |
        应仅调整生成图片 2，使画面更自然、更符合生活常识。
        不应修改病例事实、故事正文、治疗描述或其他无关图片。
        最终页面应同步使用调整后的图片 2。

    case_fact_consistency:
      follow: true
