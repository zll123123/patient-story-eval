- case_id: SM_009
  title: 费法详超适应症病例
  creative_brief: 希望这个患者故事整体专业、克制、信息准确，重点呈现肝内胆管癌/腺癌患者在基线检查、病理诊断、乙肝背景、靶向联合免疫治疗和后续化疗之间的真实时序。叙事需要明确这是基于病例记录的个体化治疗经过，不扩大适应症，不暗示普遍适用，不写治愈承诺；对于未记录疗效的部分，只能写“尚未记录/需后续复查”，不能补写缓解或获益。
  image_dir: 费法详-超适应症
  hard_rules:
    demographics:
      name: 患者基础信息
      expected:
        value:
          gender: 男
          age: 76
    primary_diagnosis:
      name: 核心诊断
      expected:
        value:
        - 肝恶性肿瘤（肝内胆管癌，小胆管型）
        - 肝囊肿
        - 慢性乙型病毒性肝炎
        - 高血压
        - 慢性萎缩性胃炎伴糜烂（O1）
        - 双肺多发小结节
        - 双肺下叶少许炎症及纤维灶
        - 主动脉及冠脉硬化
        - 胰腺尾部囊性灶
        - 双肾囊肿
    visible_signs:
      name: 关键症状/体征
      expected:
        value:
        - 检查发现肝占位5天。
        - 现病人一般状况可，应家属要求转当地治疗，予以明日出院。
    treatment_timeline:
      name: 治疗时序
      expected:
        value:
        - timepoint: 出院后治疗
          treatments:
          - 安罗替尼
          - 派安普利单抗
          - 化疗
          change: 2025年9月21日 安罗替尼+派安普利单抗，2025年9月22日化疗
          observed_outcome: ''
    key_metrics:
      name: 关键指标变化
      expected:
        value: []
    observed_outcomes:
      name: 病例明确记载的治疗结果
      expected:
        value:
        - 病历未提供主观疗效总结
        - 现病人一般状况可，应家属要求转当地治疗，予以明日出院。
        - 治疗后2025-09-21复查[指标C]为[数值]，当前状态受控/异常（注：无治疗后复查数据）
