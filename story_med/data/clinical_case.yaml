- case_id: SM_001
  title: 早期 EGFR 肺腺癌靶向治疗回归工作 - 验证标准靶向治疗叙事、基础事实保真与人物温度表达
  creative_brief: 希望这个患者故事的幻灯风格，整体上是温暖、克制的，信息清晰但不生硬。色调可以偏柔和的大地色系或低饱和暖白，配上真实的生活场景照片，比如她在备课、和家人吃饭、在公园散步，而不是刻意摆拍的“患者照”。文字尽量简短，每页两三行就好，叙事节奏松弛一些，像一位医生在轻声向同行介绍一个印象深刻的病例，或像医学编辑梳理患者故事时那种既尊重事实又不失人情味的笔触。关键信息——诊断分期、基因突变、用药方案、疗效评估、不良反应及处理、当前状态——都保留，但自然地嵌在叙述里，不用表格罗列。语言上，可以用“她后来回忆说”“医生当时也很意外”这类带一点温度却不煽情的表述。最后留一个安静的收尾，比如“现在，她已经回到讲台，继续讲她喜欢的课文。”
  case_facts: ''
  hard_rules:
    disease:
      name: 核心疾病
      description: 患者主要诊断疾病
      check_goal: 检查疾病是否被写错
      expected: 左肺上叶腺癌
    disease_subtype:
      name: 疾病亚型
      description: 分子分型、病理分型等关键信息
      check_goal: 检查疾病关键属性是否被篡改
      expected:
        pathology: 腺癌
        molecular: EGFR 19号外显子缺失
    stage:
      name: 疾病阶段
      description: 肿瘤分期或疾病严重程度（基线状态）
      check_goal: 检查疾病阶段是否一致
      expected: IB期，cT1cN0M0
    gender:
      name: 性别
      description: 男性/女性
      check_goal: 检查患者身份一致性
      expected: 女性
    age_group:
      name: 年龄段
      description: 建议不用精确年龄，而是年龄段
      check_goal: 检查患者画像是否失真
      expected: 50-59岁
    treatments:
      name: 核心治疗方式
      description: 真实接受过的治疗（不含疗效数据）
      check_goal: 检查是否编造治疗
      expected:
      - 奥希替尼 80mg QD 一线治疗
      - 1级皮疹及甲沟炎对症处理
    outcome:
      name: 当前疾病状态
      description: 当前结局或疗效状态（包含动态变化）
      check_goal: 检查是否夸大疗效
      expected:
      - 2个月后达部分缓解，6个月后持续PR
      - 用药14个月至今病情稳定
      - 已恢复正常工作
