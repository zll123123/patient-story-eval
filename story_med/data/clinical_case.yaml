              treatments:
                - "TIPS治疗"
              change: "因反复呕血、黑便及腹水等门脉高压相关问题行TIPS治疗"
              observed_outcome: "此后再未出现呕血、黑便"
            - timepoint: "2024-06-12"
              treatments:
                - "消融治疗"
              change: "磁共振提示肝右叶前上段多发强化结节，肝癌可能后行消融治疗"
              observed_outcome: ""
            - timepoint: "2024-07-23至2024-07-29"
              treatments:
                - "介入治疗"
                - "消融治疗"
              change: "先后行介入及消融治疗"
              observed_outcome: ""
            - timepoint: "2024-09-20"
              treatments:
                - "肝动脉造影"
                - "肝动脉栓塞术"
                - "保肝治疗"
                - "营养支持"
              change: "行肝动脉造影+肝动脉栓塞术，术后给予保肝、营养等对症治疗"
              observed_outcome: ""
            - timepoint: "2024-09-26"
              treatments:
                - "CT引导下肝癌微波消融术"
                - "保肝治疗"
                - "营养支持"
              change: "行CT引导下肝癌微波消融术，术后给予保肝、营养等对症治疗"
              observed_outcome: "患者病情好转"
            - timepoint: "2025-03-12"
              treatments:
                - "肝动脉造影"
                - "肝动脉栓塞术"
              change: "复查提示肝右前叶下段复发灶可能后行肝动脉造影+肝动脉栓塞术"
              observed_outcome: ""
            - timepoint: "2025-08-25起"
              treatments:
                - "艾帕洛利托沃瑞利单抗（齐倍安）注射液"
              change: "AFP由原来的800多升高背景下换用艾帕洛利托沃瑞利单抗，8月25日输第一针，后续继续给药"
              observed_outcome: "AFP曾由800多降至300多，后又升至500多及3200多"
            - timepoint: "2025-12-02"
              treatments:
                - "TACE"
                - "HAIC"
