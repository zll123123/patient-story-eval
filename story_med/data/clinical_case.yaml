  title: 安达唐病例
  creative_brief: 希望这个患者故事的幻灯风格，整体上是温暖、克制的，信息清晰但不生硬。色调可以偏柔和的大地色系或低饱和暖白，配上真实的生活场景照片，比如和家人吃饭、在公园散步，而不是刻意摆拍的“患者照”。
  image_dir: 安达唐-孙
  hard_rules:
    demographics:
      name: 患者基础信息
      expected:
