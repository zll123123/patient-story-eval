                - "利福昔明片"
                - "茵栀黄颗粒"
                - "熊去氧胆酸胶囊"
                - "乳果糖口服溶液"
              change: "出院带药方案"
              observed_outcome: "患者无不适，尿便可"

      key_metrics:
        name: 关键指标变化
        expected:
          value:
            - metric: "AFP"
              before: "33.3 ng/mL"
              after: "3197.5 ng/mL"
              timepoint: "2025-11-28"
            - metric: "AFP"
              before: "3197.5 ng/mL"
              after: "2318.0 ng/mL"
              timepoint: "2025-12-08"
            - metric: "甲胎蛋白异质体比率"
              before: "37.6%"
              after: "53.9%"
              timepoint: "2025-11-28"
            - metric: "异常凝血酶原"
              before: ""
              after: "12967.76 mAU/mL"
              timepoint: "2025-11-28"
            - metric: "白蛋白"
              before: ""
              after: "28.7 g/L"
              timepoint: "基线/检验单"
            - metric: "血小板计数"
              before: ""
              after: "29 *10^9/L"
              timepoint: "基线/检验单"

      observed_outcomes:
        name: 病例明确记载的治疗结果
        expected:
          value:
            - "TIPS治疗后再未出现呕血、黑便"
            - "2024-09-26微波消融术后患者病情好转"
            - "艾帕洛利托沃瑞利单抗治疗后AFP曾由800多降至300多，随后又升高"
