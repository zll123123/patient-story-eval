    title: 卢胜肝癌病例
    creative_brief: 希望这个患者故事整体专业、克制、信息准确，重点呈现肝癌长期治疗过程、反复介入/消融治疗、指标变化和带病管理，不夸大疗效。
    image_dir: "卢胜-肝癌"
    hard_rules:
      demographics:
        name: 患者基础信息
        expected:
          value:
            gender: "男"
            age: 57

      primary_diagnosis:
        name: 核心诊断
        expected:
          value:
            - "肝恶性肿瘤"
            - "酒精性肝硬化"
            - "食管静脉曲张"
            - "胃底静脉曲张"
            - "门脉高压性胃肠病"
            - "腹水"
            - "高氨血症"
            - "低蛋白血症"

      visible_signs:
        name: 关键症状/体征
        expected:
          value:
            - "乏力"
            - "反复呕血"
            - "黑便"
            - "反复腹水"
            - "皮肤巩膜无黄染"
            - "下肢无水肿"

      treatment_timeline:
        name: 治疗时序
        expected:
