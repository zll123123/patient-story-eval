- case_id: SM_006
  title: 淋巴瘤病例1
  creative_brief: 希望这个患者故事整体专业、克制、信息准确，重点呈现淋巴瘤从发现、病理确认、随访、进展到治疗和缓解的完整过程。叙事要覆盖常见临床节点：初诊发现、PET-CT或病理确诊、是否有治疗指征、后续随访、复发或进展、化疗及疗效评价、当前状态。不夸大疗效，不写治愈承诺。
  image_dir: 淋巴瘤-病例1
  hard_rules:
    demographics:
      name: 患者基础信息
      expected:
        value:
          gender: 男
          age: 60
          age_reference_date: '2024-08-18'
          admission_date: '2024-08-18'
    primary_diagnosis:
      name: 核心诊断
      expected:
        value:
        - 滤泡性非霍奇金淋巴瘤
        - DLBCL（弥漫性大B细胞淋巴瘤）
    visible_signs:
      name: 关键症状/体征
      expected:
        value:
        - 确诊滤泡淋巴4年
        - 肠系膜增厚模糊伴高代谢肿大淋巴结，代谢较前减低，形态较前退缩；其余前片所见异常高代谢病灶，本次显像均已消失。
    treatment_timeline:
      name: 治疗时序
      expected:
        value:
        - timepoint: 化疗及升白治疗周期
          treatments:
          - 化疗（已行6次）
          - 长效升白针（2025-01-01，2025-01-02注射）
          - 短效升白针（2025-01-08治疗）
          change: 末次化疗：2025-01-01，后续进行升白针治疗。
          observed_outcome: ''
    key_metrics:
      name: 关键指标变化
      expected:
        value:
        - metric: PET/CT评估
          before: ''
          after: Deauville评分：5，Lugano评分：PR
          timepoint: '2025-02-12'
    observed_outcomes:
      name: 病例明确记载的治疗结果
      expected:
        value:
        - Lugano评分：PR（部分缓解）
        - 肠系膜增厚模糊伴高代谢肿大淋巴结，代谢较前减低，形态较前退缩；其余前片所见异常高代谢病灶，本次显像均已消失。
        - 治疗后2025-02-12复查PET/CT，Deauville评分：5，Lugano评分：PR。
- case_id: SM_007
  title: 费法详腺癌病例-原始病例未记录疗效
  creative_brief: 希望这个患者故事整体专业、克制、信息准确，重点呈现肝内胆管癌/腺癌从发现、诊断、基线检查、治疗方案、指标变化到疗效评价的完整过程。叙事要覆盖常见病例节点：主诉、影像/病理、HBV背景、基线异常、治疗、复查、当前状态。不夸大疗效，不写治愈承诺。
  image_dir: 费法详-腺癌
  hard_rules:
    demographics:
      name: 患者基础信息
      expected:
        value:
          gender: 男
          age: 76
    primary_diagnosis:
      name: 核心诊断
      expected:
        value:
        - 肝恶性肿瘤
        - 肝囊肿
        - 慢性乙型病毒性肝炎
        - 高血压
        - 慢性萎缩性胃炎伴糜烂（O1）
        - 双肺多发小结节
        - 双肺下叶少许炎症及纤维灶
        - 主动脉及冠脉硬化
        - 窦性心律,I度房室传导阻滞,不完全性右束支传导阻滞,T波改变
        - 二、三尖瓣少量反流
        - 主动脉瓣退行性变
        - 左室肌顺应性下降
        - 左室收缩功能正常
        - 肝实性占位（性质待定）
        - 腹膜后淋巴结显示
        - 肝多发小囊肿
        - 胰头脂肪浸润
        - 胰腺尾部囊性灶
        - 双肾囊肿
    visible_signs:
      name: 关键症状/体征
      expected:
        value:
        - 检查发现肝占位5天。
    treatment_timeline:
      name: 治疗时序
      expected:
        value:
        - timepoint: '2025-09-21'
          treatments:
          - 仑伐替尼
          - 达伯舒
          change: 初始方案
          observed_outcome: ''
    key_metrics:
      name: 关键指标变化
      expected:
        value: []
    observed_outcomes:
      name: 病例明确记载的治疗结果
      expected:
        value:
        - 病历未提供主观疗效总结
        - 治疗后2025-09-22复查化疗，当前状态受控/异常
