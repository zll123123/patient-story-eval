- case_id: SM_002
  title: 卢胜肝癌病例
  creative_brief: 希望这个患者故事整体专业、克制、信息准确，重点呈现肝癌长期治疗过程、反复介入/消融治疗、指标变化和带病管理，不夸大疗效。
  image_dir: 卢胜-肝癌
  hard_rules:
    demographics:
      name: 患者基础信息
      expected:
        value:
          gender: 男
          age: 57
    primary_diagnosis:
      name: 核心诊断
      expected:
        value:
        - 恶性肿瘤
        - 肝恶性肿瘤
        - 酒精性肝硬化
        - 高氨血症
        - 低蛋白血症
        - 食管静脉曲张
        - 胃底静脉曲张
        - 门脉高压性胃肠病
        - 腹水
        - 脾功能亢进
        - 胆汁淤积症
        - 肝囊肿
        - 胆囊炎
        - 脾梗死（可能）
    visible_signs:
      name: 关键症状/体征
      expected:
        value:
        - 9年前无明显诱因出现乏力，无消瘦、发热、皮肤巩膜黄染、皮肤瘙痒、恶心、呕吐、腹胀、腹痛。7年余前发现食管重度静脉曲张，红色征阳性，此后反复出现呕血、黑便，并在外院行脾动脉栓塞治疗，效果欠佳，此后出现反复腹水等，患者6年前在我院行TIPS治疗，此后再未出现呕血、黑便。17月前在门诊行磁共振提示：肝右叶前上段多发强化结节，肝癌可能。
        - 患者无不适，尿便可。查体：神志清，精神可，皮肤巩膜无黄染。计算力及定向力正常，心肺无异常体征。腹部饱满，无压痛及反跳痛，移动性浊音(-)，下肢无水肿。
    treatment_timeline:
      name: 治疗时序
      expected:
        value:
        - timepoint: 7年余前
          treatments:
          - 脾动脉栓塞治疗
          change: 脾动脉栓塞治疗
          observed_outcome: ''
        - timepoint: 6年前
          treatments:
          - TIPS治疗
          change: TIPS治疗
          observed_outcome: ''
        - timepoint: 2024-6-12
          treatments:
          - 消融治疗
          change: 消融治疗
          observed_outcome: ''
        - timepoint: 2024-7-23
          treatments:
          - 介入及消融治疗
          change: 介入及消融治疗
          observed_outcome: ''
        - timepoint: '2024-09-20'
          treatments:
          - 肝动脉造影+肝动脉栓塞术
          change: 肝动脉造影+肝动脉栓塞术
          observed_outcome: ''
        - timepoint: '2024-09-26'
          treatments:
          - CT引导下肝癌微波消融术
          change: CT引导下肝癌微波消融术
          observed_outcome: ''
        - timepoint: '2025-03-12'
          treatments:
          - 肝动脉造影+肝动脉栓塞术
          change: 肝动脉造影+肝动脉栓塞术
          observed_outcome: ''
        - timepoint: 出院带药（2025-10-23）
          treatments:
          - (国)门冬氨酸鸟氨酸颗粒(瑞甘)(3g*10袋) 口服3g
          - (高氨血症)利福昔明片(昔服申)(0.2g*12片) 口服0.40g
          - (基)茵栀黄颗粒3g*10袋 口服2袋
          - (集8)熊去氧胆酸胶囊(250mg*24粒) 口服250mg
          - (基,联3)△乳果糖口服溶液(杜密克)(15ml:10g(667mg/ml)*6袋) 口服15ml
          change: 初始方案/无调整
          observed_outcome: ''
    key_metrics:
      name: 关键指标变化
      expected:
        value:
        - metric: 甲胎蛋白(AFP)
          before: 363.5 ng/mL
          after: 2318.0 ng/mL
          timepoint: '2025-12-08'
    observed_outcomes:
      name: 病例明确记载的治疗结果
      expected:
        value:
        - 入院后完善检查，于10-22行TACE治疗。现病情平稳，今日出院。
        - 患者无不适，尿便可。查体：神志清，精神可，皮肤巩膜无黄染。计算力及定向力正常，心肺无异常体征。腹部饱满，无压痛及反跳痛，移动性浊音(-)，下肢无水肿。
        - 治疗后2025-12-08复查甲胎蛋白为2318.0 ng/mL，当前状态异常（参考值≤7）；血氨为67 umol/L，当前状态受控（参考值18-72）。
