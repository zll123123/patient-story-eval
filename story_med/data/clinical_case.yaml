clinical_cases:
  - case_id: SM_001
    title: 安达唐病例
    creative_brief: 希望这个患者故事的幻灯风格，整体上是温暖、克制的，信息清晰但不生硬。色调可以偏柔和的大地色系或低饱和暖白，配上真实的生活场景照片，比如和家人吃饭、在公园散步，而不是刻意摆拍的“患者照”。
    image_dir: "安达唐-孙"
    hard_rules:
      demographics:
        name: 患者基础信息
        expected:
          value:
            gender: "男"
            age: 69

      primary_diagnosis:
        name: 核心诊断
        expected:
          value:
            - "糖尿病"
            - "慢性肾病"
            - "高血压"

      visible_signs:
        name: 关键症状/体征
        expected:
          value:
            - "双下肢水肿"
            - "泡沫尿"

      treatment_timeline:
        name: 治疗时序
        expected:
          value:
            - timepoint: "治疗前"
              treatments:
                - "利格列汀"
                - "阿托伐他汀"
                - "螺内酯"
                - "呋塞米片"
                - "阿里沙坦酯片"
              change: "初始方案"
              observed_outcome: ""
            - timepoint: "治疗一周"
              treatments:
                - "利格列汀"
                - "安达唐"
                - "阿托伐他汀"
                - "螺内酯"
                - "呋塞米片"
                - "阿里沙坦酯片"
              change: "新增安达唐"
              observed_outcome: ""
            - timepoint: "治疗四周"
              treatments:
                - "利格列汀"
                - "安达唐"
                - "阿托伐他汀"
                - "螺内酯"
                - "呋塞米片"
                - "阿里沙坦酯片"
              change: "无调整"
              observed_outcome: "尿蛋白转阴，FPG、PBG、HbA1c、Scr较治疗前下降"
            - timepoint: "治疗八周"
              treatments:
                - "利格列汀"
                - "安达唐"
                - "阿托伐他汀"
                - "螺内酯"
                - "呋塞米片"
                - "阿里沙坦酯片"
              change: "无调整"
              observed_outcome: "FPG降至6.4 mmol/L，HbA1c降至6.3%，Scr降至128.3 umol/L，尿蛋白阴性"

      key_metrics:
        name: 关键指标变化
        expected:
          value:
            - metric: "FPG"
              before: "14.47 mmol/L"
              after: "6.4 mmol/L"
              timepoint: "治疗八周"
            - metric: "PBG"
              before: "17.8 mmol/L"
              after: "8.6 mmol/L"
              timepoint: "治疗八周"
            - metric: "HbA1c"
              before: "12.6%"
              after: "6.3%"
              timepoint: "治疗八周"
            - metric: "Scr"
              before: "162.3 umol/L"
              after: "128.3 umol/L"
              timepoint: "治疗八周"
            - metric: "尿蛋白"
              before: "(+)"
              after: "(-)"
              timepoint: "治疗八周"

      observed_outcomes:
        name: 病例明确记载的治疗结果
        expected:
          value:
            - "FPG由14.47降至6.4"
            - "HbA1c由12.6降至6.3"
            - "Scr由162.3降至128.3"
            - "尿蛋白由(+)转为(-)"

  - case_id: SM_002
    title: 卢胜肝癌病例
    creative_brief: 希望这个患者故事整体专业、克制、信息准确，重点呈现肝癌长期治疗过程、反复介入/消融治疗、指标变化和带病管理，不夸大疗效。
    image_dir: "卢胜-肝癌"
    hard_rules:
      demographics:
        name: 患者基础信息
        expected:
          value:
            gender: "男"
            age: 57

      primary_diagnosis:
        name: 核心诊断
        expected:
          value:
            - "肝恶性肿瘤"
            - "酒精性肝硬化"
            - "食管静脉曲张"
            - "胃底静脉曲张"
            - "门脉高压性胃肠病"
            - "腹水"
            - "高氨血症"
            - "低蛋白血症"

      visible_signs:
        name: 关键症状/体征
        expected:
          value:
            - "乏力"
            - "反复呕血"
            - "黑便"
            - "反复腹水"
            - "皮肤巩膜无黄染"
            - "下肢无水肿"

      treatment_timeline:
        name: 治疗时序
        expected:
          value:
            - timepoint: "6年前"
              treatments:
                - "TIPS治疗"
              change: "因反复呕血、黑便及腹水等门脉高压相关问题行TIPS治疗"
              observed_outcome: "此后再未出现呕血、黑便"
            - timepoint: "2024-06-12"
              treatments:
                - "消融治疗"
              change: "磁共振提示肝右叶前上段多发强化结节，肝癌可能后行消融治疗"
              observed_outcome: ""
            - timepoint: "2024-07-23至2024-07-29"
              treatments:
                - "介入治疗"
                - "消融治疗"
              change: "先后行介入及消融治疗"
              observed_outcome: ""
            - timepoint: "2024-09-20"
              treatments:
                - "肝动脉造影"
                - "肝动脉栓塞术"
                - "保肝治疗"
                - "营养支持"
              change: "行肝动脉造影+肝动脉栓塞术，术后给予保肝、营养等对症治疗"
              observed_outcome: ""
            - timepoint: "2024-09-26"
              treatments:
                - "CT引导下肝癌微波消融术"
                - "保肝治疗"
                - "营养支持"
              change: "行CT引导下肝癌微波消融术，术后给予保肝、营养等对症治疗"
              observed_outcome: "患者病情好转"
            - timepoint: "2025-03-12"
              treatments:
                - "肝动脉造影"
                - "肝动脉栓塞术"
              change: "复查提示肝右前叶下段复发灶可能后行肝动脉造影+肝动脉栓塞术"
              observed_outcome: ""
            - timepoint: "2025-08-25起"
              treatments:
                - "艾帕洛利托沃瑞利单抗（齐倍安）注射液"
              change: "AFP由原来的800多升高背景下换用艾帕洛利托沃瑞利单抗，8月25日输第一针，后续继续给药"
              observed_outcome: "AFP曾由800多降至300多，后又升至500多及3200多"
            - timepoint: "2025-12-02"
              treatments:
                - "TACE"
                - "HAIC"
              change: "AFP升至3100多后行TACE+HAIC治疗"
              observed_outcome: "现病情平稳，出院"
            - timepoint: "出院带药"
              treatments:
                - "门冬氨酸鸟氨酸颗粒"
                - "利福昔明片"
                - "茵栀黄颗粒"
                - "熊去氧胆酸胶囊"
                - "乳果糖口服溶液"
              change: "出院带药方案"
              observed_outcome: "患者无不适，尿便可"

      key_metrics:
        name: 关键指标变化
        expected:
          value:
            - metric: "AFP"
              before: "33.3 ng/mL"
              after: "3197.5 ng/mL"
              timepoint: "2025-11-28"
            - metric: "AFP"
              before: "3197.5 ng/mL"
              after: "2318.0 ng/mL"
              timepoint: "2025-12-08"
            - metric: "甲胎蛋白异质体比率"
              before: "37.6%"
              after: "53.9%"
              timepoint: "2025-11-28"
            - metric: "异常凝血酶原"
              before: ""
              after: "12967.76 mAU/mL"
              timepoint: "2025-11-28"
            - metric: "白蛋白"
              before: ""
              after: "28.7 g/L"
              timepoint: "基线/检验单"
            - metric: "血小板计数"
              before: ""
              after: "29 *10^9/L"
              timepoint: "基线/检验单"

      observed_outcomes:
        name: 病例明确记载的治疗结果
        expected:
          value:
            - "TIPS治疗后再未出现呕血、黑便"
            - "2024-09-26微波消融术后患者病情好转"
            - "艾帕洛利托沃瑞利单抗治疗后AFP曾由800多降至300多，随后又升高"
            - "2025年12月2日行TACE+HAIC治疗"
            - "现病情平稳，出院"
            - "患者无不适，尿便可，皮肤巩膜无黄染，下肢无水肿"

  - case_id: SM_003
    title: 卢肺癌病例-不填写额外的要求
    creative_brief: 
    image_dir: "卢-肺癌"
    hard_rules:
      demographics:
        name: 患者基础信息
        expected:
          value:
            gender: "女"
            age: 71

      primary_diagnosis:
        name: 核心诊断
        expected:
          value:
            - "左肺上叶磨玻璃结节"
            - "肺腺癌"
            - "高血压病史"
            - "EGFR 19Del缺失突变"

      visible_signs:
        name: 关键症状/体征
        expected:
          value:
            - "发现左肺结节2周"
            - "无吸烟史"
            - "无饮酒史"

      treatment_timeline:
        name: 治疗时序
        expected:
          value:
            - timepoint: "入院前2周"
              treatments:
                - "胸部CT检查"
              change: "胸部CT提示左肺上叶磨玻璃结节，后转入拟行胸腔镜手术治疗"
              observed_outcome: "发现左肺上叶磨玻璃结节"
            - timepoint: "术后"
              treatments:
                - "胸腔镜手术治疗"
                - "奥西替尼 80mg bid"
              change: "术后根据肺腺癌及EGFR 19Del缺失突变给予靶向辅助治疗"
              observed_outcome: "肿瘤标志物后续复查恢复正常范围"

      key_metrics:
        name: 关键指标变化
        expected:
          value:
            - metric: "糖类抗原CA12-5"
              before: "57.8 U/ml"
              after: "恢复正常范围"
              timepoint: "后续复查"
            - metric: "神经元特异性烯醇化酶"
              before: "23.0 ng/mL"
              after: "恢复正常范围"
              timepoint: "后续复查"
            - metric: "癌胚抗原"
              before: ""
              after: "恢复正常范围"
              timepoint: "后续复查"
            - metric: "非小细胞肺癌抗原"
              before: ""
              after: "恢复正常范围"
              timepoint: "后续复查"
            - metric: "鳞状细胞癌相关抗原"
              before: ""
              after: "恢复正常范围"
              timepoint: "后续复查"

      observed_outcomes:
        name: 病例明确记载的治疗结果
        expected:
          value:
            - "肿瘤标志物在后续复查中均恢复正常范围"
            - "术后靶向辅助治疗控制病情，延缓复发"
            - "副作用小"
