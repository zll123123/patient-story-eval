- case_id: SM_004
  title: zht肝癌病例
  creative_brief: 希望这个患者故事整体专业、克制、信息准确，重点呈现肝癌的发现、诊断、手术/介入/靶向/免疫治疗、复查指标变化和疾病转归。叙事要覆盖常见的临床节点：入院发现、病理或影像确诊、治疗方案调整、肿瘤标志物或影像随访、病情进展或缓解、当前状态。不夸大疗效，不写治愈承诺，风格保持温暖但不过分煽情。
  image_dir: zht-肝癌
  hard_rules:
    demographics:
      name: 患者基础信息
      expected:
        value:
          gender: 女
          age: 55
    primary_diagnosis:
