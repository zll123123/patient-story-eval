hard_rule_fields:
  demographics:
    name: 患者基础信息
    value_type: object
    description: 患者不可错的基础身份信息，用于约束叙事主体和视觉年龄。
    properties:
      gender:
        name: 性别
        value_type: string
        description: 病例明确记录的患者性别。
      age:
        name: 年龄
        value_type: integer
        description: 病例明确记录的患者年龄。
      age_reference_date:
        name: 年龄基准时间
        value_type: string
        description: 提取到的 age 对应的基准时间点（如入院时间、当前就诊时间等）。若无明确时间，则默认为当前提取时间。
      admission_date:
        name: 入院时间
        value_type: string
        description: 本次住院或首次就诊的具体日期（或模糊时间段），用于提供时间基准。

  treatment_timeline:
    name: 治疗时序
    value_type: array
    description: 按病例原文维护的治疗阶段、药物/治疗方式、调整说明和已记录结果。
    item_schema:
      timepoint:
        name: 时间点/阶段
        value_type: string
        description: 病例原文中的治疗阶段或时间点。
      age_at_this_stage:
        name: 该阶段年龄
        value_type: integer
        description: 病例原文中明确提及的该治疗阶段的年龄（如“56岁时”）。若无则不填。
      treatments:
        name: 治疗/药物列表
        value_type: array
        description: 当前阶段明确出现的治疗、手术、介入、用药或方案，尽量保持原文顺序。
      change:
        name: 调整说明
        value_type: string
        description: 当前阶段相较上一阶段的新增、停用、换药或治疗变化。
      observed_outcome:
        name: 记录结果
        value_type: string
        description: 病例原文在该阶段明确记录的症状、指标或病情变化。