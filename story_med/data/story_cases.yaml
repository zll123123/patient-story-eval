  - case_id: SM_003
    description: 早期乳腺癌 ADC 药物
    creative_brief: |
      生成一篇面向临床医生的患者故事，风格克制、清晰、有人物温度。重点呈现乳腺癌患者新辅助ADC治疗、术后病理缓解、安全性信息和工作生活恢复情况。pCR可以客观呈现，但不得写成治愈或根治。
    case_facts: |
      患者基本信息

      患者：45岁女性，外企财务经理，单亲妈妈，有一子12岁

      现病史

      2023年9月患者确诊左乳浸润性导管癌，分期为cT2N1M0（IIB期），HER2阳性（IHC 3+）。2023年10月起接受T-DXd（德曲妥珠单抗）新辅助治疗4周期。

      分子与生物标志物检测

      - HER2阳性（IHC 3+）

      诊断

      - 左乳浸润性导管癌
      - cT2N1M0，IIB期
      - HER2阳性（IHC 3+）

      治疗经过

      第一阶段：新辅助治疗（2023年10月起）
      - 方案： T-DXd（德曲妥珠单抗）新辅助治疗4周期
      - 不良反应： 轻度恶心1级、乏力1级
      - 特殊安全性： 无间质性肺病

      第二阶段：术后及辅助治疗阶段
      - 术后病理： 达到pCR（病理学完全缓解）
      - 当前继续辅助治疗中

      治疗转归与预后

      - 当前状态： 术后恢复良好
      - 生活质量： 已恢复半天工作
      - 医生信息： 主治医生为某三甲医院乳腺外科主任医师
