  - case_id: SM_006
    description: 极长多线治疗信息爆炸
    creative_brief: |
      生成一篇信息压缩能力强、叙事节奏清晰的患者故事。重点呈现年轻晚期肺腺癌患者多线治疗、关键进展节点、当前临床试验疗效和重要不良反应史。避免流水账，避免文本过长。
    case_facts: |
      患者，男，37岁，程序员，妻子怀孕中。2021年1月初始诊断右肺腺癌（cT2aN2M1a，IV期），基因检测示EGFR 21号外显子L858R突变。2021年2月一线接受吉非替尼治疗，6个月后进展。2021年8月二线接受奥希替尼治疗，11个月后进展，T790M阳性。2022年7月三线接受奥希替尼 + 贝伐珠单抗，8个月后进展。2023年3月四线接受培美曲塞 + 卡铂 + 贝伐珠单抗4周期，SD后培美曲塞+贝伐维持。2024年1月五线进入临床试验，使用新型EGFR/MET双抗。当前试验用药9个月，肿瘤缩小25%，ECOG 1分。不良反应史包括吉非替尼相关皮疹2级、奥希替尼相关甲沟炎1级、贝伐相关蛋白尿2级、化疗后骨髓抑制3级且恢复良好。医生为肿瘤内科和临床研究医生。
