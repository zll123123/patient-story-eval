      disease:
        name: 核心疾病
        description: 患者主要诊断疾病
        check_goal: 检查疾病是否被写错
        expected: 胃体低分化腺癌，腹膜转移
      disease_subtype:
        name: 疾病亚型
        description: 分子分型、病理分型等关键信息
        check_goal: 检查疾病关键属性是否被篡改
        expected:
          pathology: 低分化腺癌
          molecular: null
      stage:
        name: 疾病阶段
        description: 肿瘤分期或疾病严重程度（基线状态）
        check_goal: 检查疾病阶段是否一致
        expected: cT4aN2M1，IV期
      gender:
        name: 性别
        description: 男性/女性
        check_goal: 检查患者身份一致性
        expected: 男性
      age_group:
        name: 年龄段
        description: 建议不用精确年龄，而是年龄段
        check_goal: 检查患者画像是否失真
        expected: 60-69岁
      treatments:
        name: 核心治疗方式
        description: 真实接受过的治疗（不含疗效数据）
        check_goal: 检查是否编造治疗
        expected:
          - 2023年8月起信迪利单抗 + XELOX方案（奥沙利铂+卡培他滨）一线治疗
          - 信迪利单抗维持治疗
          - 化疗相关周围神经毒性2级
          - 免疫相关甲状腺功能减退1级，优甲乐替代
