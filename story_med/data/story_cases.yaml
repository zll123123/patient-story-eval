  - case_id: SM_004
    description: 复发性卵巢癌维持治疗
    creative_brief: |
      生成一篇时间线清晰但不流水账的患者故事。重点呈现卵巢癌初始治疗、首次复发、HRD阳性背景下维持治疗、不良反应和当前持续缓解状态。叙事要克制，不要把生活质量改善直接归因于药物。
    case_facts: |
      患者，女，58岁，退休会计，与丈夫同住，儿孙在国外。2021年6月初始诊断为高级别浆液性卵巢癌（IIIC期）。初始治疗为肿瘤细胞减灭术 + 紫杉醇/卡铂化疗6周期。2023年3月首次复发，表现为CA125升高，影像确认盆腔复发灶。二线治疗后进入奥拉帕利维持治疗，患者BRCA野生型但HRD阳性。维持治疗8个月后达CR，目前持续缓解。治疗中出现轻度贫血（1级）、恶心（1级）、疲劳（1级）。当前服用奥拉帕利14个月，生活质量良好，参加社区合唱团。
