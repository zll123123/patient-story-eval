  - case_id: SM_004
    description: 复发性卵巢癌维持治疗
    creative_brief: |
      生成一篇时间线清晰但不流水账的患者故事。重点呈现卵巢癌初始治疗、首次复发、HRD阳性背景下维持治疗、不良反应和当前持续缓解状态。叙事要克制，不要把生活质量改善直接归因于药物。
    case_facts: |
      患者基本信息

      患者：58岁女性，退休会计，与丈夫同住，儿孙在国外

      现病史

      2021年6月患者初始诊断为高级别浆液性卵巢癌（IIIC期）。初始治疗为肿瘤细胞减灭术联合紫杉醇/卡铂化疗6周期。2023年3月首次复发，表现为CA125升高，影像确认盆腔复发灶。二线治疗后进入奥拉帕利维持治疗。

      分子与生物标志物检测

      - BRCA野生型
      - HRD阳性

      诊断

      - 高级别浆液性卵巢癌
      - IIIC期
      - 首次复发，盆腔复发灶
      - BRCA野生型，HRD阳性

      治疗经过

      第一阶段：初始治疗
      - 方案： 肿瘤细胞减灭术 + 紫杉醇/卡铂化疗6周期

      第二阶段：复发后二线治疗及维持治疗
      - 复发时间： 2023年3月
      - 维持方案： 奥拉帕利维持治疗
      - 疗效： 维持治疗8个月后达CR，目前持续缓解
      - 不良反应： 轻度贫血1级、恶心1级、疲劳1级

      治疗转归与预后

      - 当前状态： 当前服用奥拉帕利14个月
      - 疗效： 持续缓解
      - 生活质量： 生活质量良好，参加社区合唱团
