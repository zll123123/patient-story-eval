  - case_id: SM_003
    description: 早期乳腺癌 ADC 药物
    creative_brief: |
      生成一篇面向临床医生的患者故事，风格克制、清晰、有人物温度。重点呈现乳腺癌患者新辅助ADC治疗、术后病理缓解、安全性信息和工作生活恢复情况。pCR可以客观呈现，但不得写成治愈或根治。
    case_facts: |
      患者，女，45岁，外企财务经理，单亲妈妈，有一子12岁。2023年9月确诊左乳浸润性导管癌（cT2N1M0，IIB期），HER2阳性（IHC 3+）。2023年10月起接受T-DXd（德曲妥珠单抗）新辅助治疗4周期。术后病理达到pCR（病理学完全缓解）。治疗中出现轻度恶心（1级）、乏力（1级），无间质性肺病。当前术后恢复良好，继续辅助治疗中，已恢复半天工作。主治医生为某三甲医院乳腺外科主任医师。
