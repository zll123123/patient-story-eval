  - case_id: SM_006
    description: 极长多线治疗信息爆炸
    creative_brief: |
      生成一篇信息压缩能力强、叙事节奏清晰的患者故事。重点呈现年轻晚期肺腺癌患者多线治疗、关键进展节点、当前临床试验疗效和重要不良反应史。避免流水账，避免文本过长。
    case_facts: |
      患者基本信息

      患者：37岁男性，程序员，妻子怀孕中

      现病史

      2021年1月患者初始诊断右肺腺癌，分期为cT2aN2M1a（IV期）。基因检测示EGFR 21号外显子L858R突变。后续经历多线治疗及临床试验用药。

      分子与生物标志物检测

      - EGFR 21号外显子L858R突变
      - T790M阳性（二线进展后）

      查体/体能状态

      - ECOG PS评分：1分（当前）

      诊断

      - 右肺腺癌
      - cT2aN2M1a，IV期
      - EGFR 21号外显子L858R突变

      治疗经过

      第一阶段：一线治疗（2021年2月起）
      - 方案： 吉非替尼
      - 转归： 6个月后进展
      - 不良反应： 吉非替尼相关皮疹2级

      第二阶段：二线治疗（2021年8月起）
      - 方案： 奥希替尼
      - 转归： 11个月后进展
      - 进展后检测： T790M阳性
      - 不良反应： 奥希替尼相关甲沟炎1级

      第三阶段：三线治疗（2022年7月起）
      - 方案： 奥希替尼 + 贝伐珠单抗
      - 转归： 8个月后进展
      - 不良反应： 贝伐相关蛋白尿2级

      第四阶段：四线治疗（2023年3月起）
      - 方案： 培美曲塞 + 卡铂 + 贝伐珠单抗4周期
      - 转归： SD后进入培美曲塞 + 贝伐维持
      - 不良反应： 化疗后骨髓抑制3级，恢复良好

