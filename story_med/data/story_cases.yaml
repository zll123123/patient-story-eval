        description: 男性/女性
        check_goal: 检查患者身份一致性
        expected: 女性
      age_group:
        name: 年龄段
        description: 建议不用精确年龄，而是年龄段
        check_goal: 检查患者画像是否失真
        expected: 50-59岁
      treatments:
        name: 核心治疗方式
        description: 真实接受过的治疗（不含疗效数据）
        check_goal: 检查是否编造治疗
